services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: halaldelivery
      POSTGRES_USER: halaldelivery
      POSTGRES_PASSWORD: halaldelivery_dev
    ports:
      - "55433:5432"
    volumes:
      - halal-delivery-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halaldelivery -d halaldelivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  halal-delivery-postgres:
